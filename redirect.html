<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WortFuchs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e6edf3;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      text-align: center;
    }
    .emoji {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }
    p.sub {
      color: #9da7b3;
      font-size: 14px;
      margin: 0 0 28px;
    }
    a.btn {
      display: block;
      padding: 16px 24px;
      background: #0071e3;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .hint {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: #9da7b3;
      line-height: 1.5;
      text-align: left;
    }
    .hint b { color: #e6edf3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🦊</div>
    <h1>WortFuchs</h1>
    <p class="sub">Almanca A1 kelime öğrenme uygulaması</p>

    <a class="btn" href="https://apps.apple.com/app/id6777784593">App Store'da Aç</a>

    <div class="hint">
      Buton açılmazsa: sağ üstteki <b>⋯</b> simgesine dokun, ardından <b>"Tarayıcıda Aç"</b> seçeneğini seç.
    </div>
  </div>
</body>
</html>
